    }

    function getHrAdvice(className) {
        const p = classPreset(className);
        if (["瑜伽静态拉伸", "普拉提核心"].includes(className)) return `恢复区 ${data.profile.recoveryHrLow}-${data.profile.recoveryHrHigh} bpm`;
        if (["Z2单车/椭圆机", "快走/坡走"].includes(className)) return `Z2 ${data.profile.z2HrLow}-${data.profile.z2HrHigh} bpm`;
        if (["HYROX Engine", "HYROX Power"].includes(className)) return `大部分 ${data.profile.steadyHrLow}-${data.profile.steadyHrHigh}，短时间 ${data.profile.thresholdHrLow}-${data.profile.thresholdHrHigh}`;
        if (className === "HYROX Complete") return `可短时间超过 ${data.profile.lthr}，注意配速`;
        return `RPE ${p.rpeMin}-${p.rpeMax}，避免长时间超过 ${data.profile.lthr}`;
    }

    function getPackageDecisionHtml(d) {
        const combat = Math.round(calcCombatPower(d));
        const budget = Math.round(getDailyBudget(d));
        const availableClasses = getClassesForDate(d);
        const selfServiceClasses = ["自助力量", "自助跑步", "Z2单车/椭圆机", "快走/坡走", "瑜伽静态拉伸", "普拉提核心"];
        const allCandidates = [...new Set([...availableClasses, ...selfServiceClasses])];
        
        const scored = allCandidates.map(name => {
            const p = classPreset(name);
            const reqCombat = Math.round(getRequiredCombat(name));
            const itemALU = p.duration * p.met * ((p.rpeMin + p.rpeMax) / 2 / 10);
            const value = nval(p.hyrox, 0) * 0.6 + nval(p.met, 5) * 0.4;
            const passed = reqCombat <= combat;
            return { name, p, reqCombat, itemALU, value, passed };
        }).sort((a, b) => b.value - a.value);
        
        const filtered = scored.filter(c => c.passed);
        const excluded = scored.filter(c => !c.passed);
        
        const protectThreshold = nval(data.profile.highIntensityProtectThreshold, 8);
        const protectAcceptable = nval(data.profile.protectAcceptableFatigue, 4);
        
        let result = `<div class="grid">`;
        result += `<div class="col-4"><div class="box"><h4>基础参数</h4>
          <p>战斗力: <b>${combat}/100</b></p>
          <p>日负荷预算: <b>${budget}</b> ALU</p>
          <p>保护阈值: >=${protectThreshold} 触发保护</p>
          <p>保护接受: <=${protectAcceptable} 疲劳成本</p>
        </div></div>`;
        
        result += `<div class="col-4"><div class="box"><h4>候选课程评分排序</h4>`;
        filtered.forEach((c, i) => {
            result += `<div style="padding:4px;border-bottom:1px solid #e5e7eb">
              <span>${i+1}. ${esc(c.name)}</span>
              <span class="muted"> 价值:${c.value.toFixed(1)}</span>
              <span class="pill green">门槛:${c.reqCombat}</span>
              <span class="pill blue">ALU:${Math.round(c.itemALU)}</span>
            </div>`;
        });
        result += `</div></div>`;
        
        if (excluded.length > 0) {
            result += `<div class="col-4"><div class="box"><h4>被排除课程</h4>`;
            excluded.forEach(c => {
                result += `<div style="padding:4px;border-bottom:1px solid #e5e7eb">
                  <span>${esc(c.name)}</span>
                  <span class="pill red">门槛:${c.reqCombat} > ${combat}</span>
                </div>`;
            });
            result += `</div></div>`;
        }
        
        result += `</div>`;
        
        const pkg = generatePackage(d);
        if (!pkg.fallback && pkg.items.length > 0) {
            result += `<div style="margin-top:12px;padding-top:12px;border-top:1px solid #e5e7eb">
              <h4>套餐构建过程</h4>
              <ol>`;
            let totalALU = 0;
            let totalTime = 0;
            pkg.items.forEach((item, i) => {
                const itemALU = item.p.duration * item.p.met * ((item.p.rpeMin + item.p.rpeMax) / 2 / 10);
                totalALU += itemALU;
                totalTime += item.p.duration;
                const avgFatigue = pkg.items.slice(0, i+1).reduce((sum, x) => sum + x.p.fatigue, 0) / (i+1);
                result += `<li><b>${esc(item.name)}</b> - 添加成功
                  <ul>
                    <li>ALU: ${Math.round(itemALU)} (累计: ${Math.round(totalALU)} <= ${budget})</li>
                    <li>时间: ${item.p.duration}分钟 (累计: ${totalTime} <= 240)</li>
                    <li>疲劳成本: ${item.p.fatigue} (平均: ${avgFatigue.toFixed(1)})</li>
                  </ul>
                </li>`;
            });
            result += `</ol></div>`;
        }
        
        return result;
    }

    function renderCompactHomeDays(dates){
        return `<div class="table-wrapper"><table><tr><th>日期</th><th>排班</th><th>角色</th><th>推荐</th><th>热量</th><th>饮食/心率重点</th><th>操作</th></tr>
 ${dates.map(x=>{
  const p=makePlan(x);
  const meal=mealAdvice(p.plan,p.energy,p.schedule);
  return `<tr><td>${dateLabel(x)}</td><td>${p.schedule?`${phaseLabel(p.schedule)} ${p.schedule.nightShift?pill("夜班","orange"):""}`:"-"}</td><td>${pill(roleLabel(p.role),p.role==="hyrox"||p.role==="strength"?"green":p.role==="no_train"?"gray":"orange")}</td><td>${esc(p.plan.name)} ${p.plan.focus?`/ ${esc(p.plan.focus)}`:""}<div class="muted">${p.plan.duration}分钟；RPE ${p.plan.rpe||"-"}</div></td><td><b>${p.energy.planned.targetIn} kcal</b><div class="muted">TDEE ${p.energy.planned.tdee}；步数 ${p.energy.planned.steps}</div></td><td><div class="muted">${esc(meal.hr)}</div><div class="muted">午餐作为训练后恢复餐</div></td><td><button class="secondary" onclick="quickLogDate('${x}')">打卡</button> <button class="secondary" onclick="quickClassDate('${x}')">课表</button></td></tr>`;
 }).join("")}</table></div>`;
    }

    /* =========================================================
       初始化
    ========================================================= */
function ensureSeed(){
    // 不做 data = mergeData(data) 避免覆盖本地数据
    if(!data.profile) data.profile = deepClone(DEFAULT_PROFILE);

    // 强制从独立存储恢复训练风格
    const savedStyle = localStorage.getItem("hyrox_training_style_v2");
    if (savedStyle && ["aggressive", "normal", "conservative"].includes(savedStyle)) {
        data.profile.trainingStyle = savedStyle;
    } else if (!data.profile.trainingStyle) {
        data.profile.trainingStyle = "normal";
    }

    // 强制从独立存储恢复高级疲劳参数
    const savedFatigueParams = localStorage.getItem("hyrox_fatigue_params_v2");
    if (savedFatigueParams) {
        try {
            const params = JSON.parse(savedFatigueParams);
            data.profile.nightShiftLoad = params.nightShiftLoad ?? 45;
            data.profile.sleepTargetHours = params.sleepTargetHours ?? 7;
            data.profile.sleepPenaltyK = params.sleepPenaltyK ?? 0.15;
            data.profile.combatPowerExponent = params.combatPowerExponent ?? 1.5;
            data.profile.nightBudgetDiscount = params.nightBudgetDiscount ?? 0.8;
            data.profile.maxPackageCourses = params.maxPackageCourses ?? 3;
            data.profile.highIntensityProtectThreshold = params.highIntensityProtectThreshold ?? 8;
            data.profile.protectAcceptableFatigue = params.protectAcceptableFatigue ?? 4;
            data.profile.acuteDecayRate = params.acuteDecayRate ?? 0.5;
            data.profile.acuteConversion = params.acuteConversion ?? 0.2;
            data.profile.shortTermWeight = params.shortTermWeight ?? 0.7;
            data.profile.longTermWeight = params.longTermWeight ?? 0.3;
            data.profile.longTermMapFactor = params.longTermMapFactor ?? 15;
            data.profile.sleepPenaltyPerHour = params.sleepPenaltyPerHour ?? 5;
        } catch (e) {}
    }
}

    function setupBodyStatsDelegate() {
    const container = document.getElementById("pageBodyStats");
    if (!container) return;
    container.addEventListener("click", function(e) {
        const btn = e.target.closest("button");
        if (!btn) return;
        if (btn.id === "saveBodyStatBtn") saveBodyStat();
        else if (btn.id === "deleteBodyStatBtn") deleteBodyStat();
    });
}

    async function initialSyncFromCloud() {
        if (!syncCode || !supabaseClient || isFirstSessionCompleted) {
            return false;
        }
        try {
            isSyncing = true;
            console.log("首次打开，正在从云端拉取数据...");
            const row = await pullRaw();
            if (row && row.state) {
                cloudRevision = Number(row.revision || 0);
                data = mergeData(row.state || {});
                saveLocalOnly();
                console.log("云端数据拉取成功，已覆盖本地");
                isFirstSessionCompleted = true;
                sessionStorage.setItem("hyrox_first_sync_completed", "true");
                autoSyncEnabled = true;
                return true;
            } else {
                console.log("云端暂无数据，使用本地数据");
                isFirstSessionCompleted = true;
                sessionStorage.setItem("hyrox_first_sync_completed", "true");
                autoSyncEnabled = true;
                return false;
            }
        } catch (e) {
            console.error("首次同步失败:", e);
            // 即使同步失败，也标记完成，避免卡死
            isFirstSessionCompleted = true;
            sessionStorage.setItem("hyrox_first_sync_completed", "true");
            autoSyncEnabled = true;
            return false;
        } finally {
            isSyncing = false;
        }
    }

    function init(){
        try{
            // 确保 data 已经在 loadInitialData() 加载完成，不做多余处理
            // 仅确保关键参数存在
            if(!data.profile) data.profile = deepClone(DEFAULT_PROFILE);
            if(!data.presets) data.presets = deepClone(CLASS_PRESETS);
            if(!data.bodyStats) data.bodyStats = {};
            
            // 确保独立存储的参数恢复（保持兼容）
            ensureSeed();
            
            const hasUsefulData = Object.keys(data.schedule || {}).length > 0 || 
                                 Object.keys(data.classes || {}).length > 0 || 
                                 Object.keys(data.logs || {}).length > 0;
            const hasLocalStorageData = localStorage.getItem(STORAGE_KEY);
            
            if (hasUsefulData || !hasLocalStorageData) {
                saveLocalOnly();
            }
            
            setupMidnightRefresh();
            setupBodyStatsDelegate();
            showTab("home");
            
            // 如果有同步码且是首次会话，则尝试从云端拉取
            if (syncCode && !isFirstSessionCompleted) {
                initialSyncFromCloud().then((cloudDataLoaded) => {
                    if (cloudDataLoaded) {
                        refreshAll();
                    }
                });
            } else {
                // 不是首次会话或没有同步码，直接启用自动同步
                autoSyncEnabled = true;
            }
            
        }catch(e){
            console.error(e);
            document.body.innerHTML=`<main><div class="card bad"><h2>程序初始化失败</h2><p>请打开浏览器 Console 查看详细报错。</p><pre>${esc(e.stack||e.message||e)}</pre></div></main>`;
        }
    }

    init();
</script>
