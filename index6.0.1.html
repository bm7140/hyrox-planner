    --bg: #f6f7fb;
    --card: #fff;
    --text: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --blue: #2563eb;
    --green: #16a34a;
    --orange: #f97316;
    --red: #dc2626;
    --purple: #7c3aed;
    --shadow: 0 8px 24px rgba(15, 23, 42, .08);
    --radius: 16px
}

* {
    box-sizing: border-box
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif
}

header {
    background: linear-gradient(135deg, #111827, #1e40af);
    color: #fff;
    padding: 24px 16px
}

header .wrap,
main {
    max-width: 1220px;
    margin: 0 auto
}

h1 {
    margin: 0 0 6px;
    font-size: 27px
}

h2 {
    margin: 0 0 12px;
    font-size: 21px
}

h3 {
    margin: 0 0 10px;
    font-size: 17px
}

p {
    margin: 6px 0
}

main {
    padding: 16px
}

.tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px
}

.tabs button {
    border: 0;
    border-radius: 999px;
    padding: 10px 16px;
    background: #e5e7eb;
    color: #111827;
    cursor: pointer;
    font-weight: 800
}

.tabs button.active {
    background: var(--blue);
    color: #fff
}

.hidden {
    display: none !important
}

.card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 14px
}

.grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 12px
}

.col-12 {
    grid-column: span 12
}

.col-9 {
    grid-column: span 9
}

.col-8 {
    grid-column: span 8
}

.col-6 {
    grid-column: span 6
}

.col-4 {
    grid-column: span 4
}

.col-3 {
    grid-column: span 3
}

.col-2 {
    grid-column: span 2
}

@media(max-width:780px) {
    .col-9,
    .col-8,
    .col-6,
    .col-4,
    .col-3,
    .col-2 {
        grid-column: span 12
    }
    table {
        font-size: 12px
    }
}

/* 移动端优化 */
@media(max-width:640px) {
    header {
        padding: 16px 12px
    }
    h1 {
        font-size: 20px
    }
    h2 {

        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis

    /* 输入框优化 */
    input, select, textarea {
        padding: 10px 12px;
        font-size: 14px;
        border-radius: 10px;
        min-height: 40px;
        width: 100%;
        box-sizing: border-box;
        background: #fff;
        color: #111827
    }
    textarea {

    }
    /* 表格内输入框特别优化 */
    table input, table select {
        padding: 6px 8px;
        font-size: 12px;
        min-height: 32px;
        width: 100%;

    /* 按钮优化 */

        -webkit-overflow-scrolling: touch;
        width: 100%;

        padding: 0;

        /* =========================================================
           工具函数
        ========================================================= */
        function $(id) { return document.getElementById(id) }

function setTodayStatus(val) {
    if (!val) return;
    const d = todayStr();
    if (!data.logs[d]) data.logs[d] = {};
    data.logs[d].status = val;
    data.logs[d].updatedAt = nowISO();
    saveData();
    renderHome();  // 刷新首页计划
}
        function todayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
        }

        function nowISO() { return new Date().toISOString() }

        function nval(v, d = 0) { const n = Number(v);return Number.isFinite(n) ? n : d }

        function deepClone(o) { return JSON.parse(JSON.stringify(o)) }

        function esc(s) { return String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;",
                '"': "&quot;", "'": "&#39;" }[m])) }

        function sid(s) { return String(s).replace(/[^\w\u4e00-\u9fa5-]/g, "_") }

        function addDays(ds, n) {
            const d = new Date(ds + "T00:00:00");
            d.setDate(d.getDate() + n);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
        }

        function daysBetween(a, b) { return Math.round((new Date(a + "T00:00:00") - new Date(b + "T00:00:00")) / 86400000) }

        function diffDays(a, b) { return Math.round((new Date(a + "T00:00:00") - new Date(b + "T00:00:00")) / 86400000) }

        function dateLabel(d) {
            const dt = new Date(d + "T00:00:00");
            return `${d} 周${["日","一","二","三","四","五","六"][dt.getDay()]}`;
        }

        function pill(t, c = "gray") { return `<span class="pill ${c}">${esc(t)}</span>` }

        function newerISO(a, b) {
            const ta = Date.parse(a || ""),
                tb = Date.parse(b || "");
            if (Number.isNaN(ta) && Number.isNaN(tb)) return 0;
            if (Number.isNaN(ta)) return -1;
            if (Number.isNaN(tb)) return 1;
            return ta - tb;
        }

        function normalizeCode(s) { return String(s || "").trim().toUpperCase().replace(/\s+/g, "-") }

        function betweenDate(d, s, e) { return d >= s && d <= e }

        function classPreset(name, presets) { 
                const p = presets || data?.presets || CLASS_PRESETS;
                return p?.[name] || CLASS_PRESETS[name] || CLASS_PRESETS["其他"] || {
                    duration: 60,
                    met: 5,
                    rpeMin: 5,
                    rpeMax: 7,
                    tag: "other",
                    fatigue: 4,
                    hyrox: 3
                } 
            }

        function oldNameMap(name) {
            const m = {
                "HYROX": "HYROX Engine",
                "Strength": "自助力量",
                "Cross Training": "循环训练",
                "恢复/拉伸": "瑜伽静态拉伸",
                "跑步": "自助跑步",
                "单车": "Z2单车/椭圆机",
                "椭圆机": "Z2单车/椭圆机",
                "私教": "私教力量"
            };
            return m[name] || name;
        }

        /* =========================================================
           核心疲劳计算函数
        ========================================================= */
        function calcTL(activities) {
            return activities.reduce((sum, a) => {
                const p = classPreset(a.type);
                const met = nval(p.met, 5);
                const minutes = nval(a.min, 0);
                const rpe = nval(a.rpe, (p.rpeMin + p.rpeMax) / 2);
                return sum + minutes * met * (rpe / 10);
            }, 0);
        }

        function getWorkAddition(d) {
            const yesterday = addDays(d, -1);
            const yesterdaySchedule = normalizeScheduleItem(data.schedule[yesterday]);
            if (yesterdaySchedule?.nightShift) return nval(data.profile.nightShiftLoad, 45);
            return 0;
        }

        function calcDTL(d) {
            const log = data.logs[d];
            if (!log) return 0;
            const acts = getActivitiesFromLog(log);
            const tl = calcTL(acts);
            const workAdd = getWorkAddition(d);
            return tl + workAdd;
        }

        function getPersonalMax() {
    const defaultMax = 855;
    const windowDays = nval(data.profile.personalMaxWindowDays, 28);
    const cutoffDate = addDays(todayStr(), -windowDays);
    
    let maxTL = 0;
    let maxTLDate = "";
    
    Object.keys(data.logs || {}).forEach(d => {
        if (d < cutoffDate) return;
        const log = data.logs[d];
        if (!log) return;
        const acts = getActivitiesFromLog(log);
        const tl = calcTL(acts);
        if (tl > maxTL) {
            maxTL = tl;
            maxTLDate = d;
        }
    });
    
    return Math.max(defaultMax, maxTL);
}

function getPersonalMaxDetails() {
    const defaultMax = 855;
    const windowDays = nval(data.profile.personalMaxWindowDays, 28);
    const cutoffDate = addDays(todayStr(), -windowDays);
    
    let maxTL = 0;
    let maxTLDate = "";
    const records = [];
    
    Object.keys(data.logs || {}).forEach(d => {
        if (d < cutoffDate) return;
        const log = data.logs[d];
        if (!log) return;
        const acts = getActivitiesFromLog(log);
        const tl = calcTL(acts);
        if (tl > 0) {
            records.push({ date: d, tl: tl, main: acts[0]?.type || '未知' });
            if (tl > maxTL) {
                maxTL = tl;
                maxTLDate = d;
            }
        }
    });
    
    records.sort((a, b) => b.tl - a.tl);
    const topRecords = records.slice(0, 5);
    
    return {
        defaultValue: defaultMax,
        maxTL: maxTL,
        maxTLDate: maxTLDate,
        windowDays: windowDays,
        topRecords: topRecords
    };
}

        function getAL7(d) {
            let sum = 0;
            for (let i = 1; i <= 7; i++) {
                sum += calcDTL(addDays(d, -i));
            }
            return sum;
        }

        function getCL28(d) {
            const windowDays = 28;
            
            let sum = 0;
            let validDays = 0;
            
            for (let i = 1; i <= windowDays; i++) {
                const date = addDays(d, -i);
                if (data.logs[date]) {
                    const dtl = calcDTL(date);
                    sum += dtl;
                    validDays++;
                }
            }
            
            if (validDays === 0) return 0;
            
            if (validDays < windowDays) {
                return (sum / validDays) * 7;
            } else {
                return sum / 4;
            }
        }

        function calcACWR(d) {
            const al7 = getAL7(d);
            const cl28 = getCL28(d);
            return al7 / Math.max(cl28, 1);
        }

        function calcRS(d) {
            const cl28 = getCL28(d);
            const personalMax = getPersonalMax();
            return cl28 / (personalMax * 7);
        }

        function calcOFS(d) {
            const acwr = calcACWR(d);
            const rs = calcRS(d);
            return 0.7 * acwr + 0.3 * rs;
        }

        function getAvgSleep7(d) {
            let sum = 0;
            for (let i = 1; i <= 7; i++) {
                const log = data.logs[addDays(d, -i)];
                const sleep = nval(log?.sleepHours, 0);
                sum += sleep || 7;
            }
            return sum / 7;
        }

        function calcRecoveryFactor(d) {
            const avgSleep = getAvgSleep7(d);
            const k = nval(data.profile.sleepPenaltyK, 0.15);
            return 1 + Math.max(0, 7 - avgSleep) * k;
        }

        function getAcuteFatigue(d, raw) {
            const decayRate = nval(data.profile.acuteDecayRate, 0.5);
            const conversion = nval(data.profile.acuteConversion, 0.2);
            const personalMax = getPersonalMax();
            const coef = conversion * 100 / (personalMax * 0.5);
            let acute = 0;
            let weight = decayRate;
            for (let offset = 1; offset <= 365; offset++) {
                if (weight < 0.005) break;
                const date = addDays(d, -offset);
                const log = data.logs && data.logs[date];
                if (log) {
                    const dtl = calcDTL(date);
                    acute += dtl * coef * weight;
                }
                weight *= decayRate;
            }
            return raw ? acute : Math.min(100, acute);
        }

        function getChronicFatigue(d) {
            const ofs = calcOFS(d);
            const recFactor = calcRecoveryFactor(d);
            const mapFactor = nval(data.profile.longTermMapFactor, 15);
            return Math.min(100, ofs * recFactor * mapFactor);
        }

        function getLastNightSleep(d) {
            const log = data.logs[d];
            return log?.sleepHours || nval(data.profile.sleepTargetHours, 7);
        }

        function calcSleepPenalty(d) {
            const sleepTarget = nval(data.profile.sleepTargetHours, 7);
            const lastNightSleep = getLastNightSleep(d);
            const penaltyPerHour = nval(data.profile.sleepPenaltyPerHour, 5);
            return Math.max(0, (sleepTarget - lastNightSleep) * penaltyPerHour);
        }

        function calcFatigueScore(d) {
            const acute = getAcuteFatigue(d);
            const chronic = getChronicFatigue(d);
            const shortWeight = nval(data.profile.shortTermWeight, 0.7);
            const longWeight = nval(data.profile.longTermWeight, 0.3);
            const sleepPenalty = calcSleepPenalty(d);
            return Math.min(100, shortWeight * acute + longWeight * chronic + sleepPenalty);
        }

        function getFeelingCoefficient(d) {
            const log = data.logs[d];
            const status = log?.status || "正常";
            const baseMap = {
                "很好": 1.2,
                "正常": 1.0,
                "疲劳": 0.8,
                "很疲劳": 0.6,
                "生病/不适": 0.0
            };
            let coeff = baseMap[status] || 1.0;
            const style = data.profile.trainingStyle || "normal";
            if (style === "aggressive") coeff = Math.min(1.2, coeff + 0.1);
            if (style === "conservative") coeff = coeff - 0.1;
            return Math.max(0, coeff);
        }

        function calcCombatPower(d) {
            const fatigue = calcFatigueScore(d);
            const feeling = getFeelingCoefficient(d);
            const base = 100 - fatigue;
            return Math.max(0, Math.min(100, base * feeling));
        }

        function getRequiredCombat(className) {
            const p = classPreset(className);
            if (p.requiredCombat != null) return p.requiredCombat;
            const met = nval(p.met, 5);
            const fatigue = nval(p.fatigue, 4);
            return Math.min(100, met * 7 + fatigue * 2.5);
        }

        function getDailyBudget(d) {
            const combat = calcCombatPower(d);
            const power = nval(data.profile.combatPowerExponent, 1.5);
            const personalMax = getPersonalMax();
            const f = Math.max(0.2, Math.pow(combat / 100, power));
            let budget = personalMax * f;
            const s = normalizeScheduleItem(data.schedule[d]);
            if (s?.nightShift) {
                const discount = nval(data.profile.nightBudgetDiscount, 0.8);
                budget *= discount;
            }
            return budget;
        }

        function generatePackage(d) {
            const combat = calcCombatPower(d);
            const budget = getDailyBudget(d);
            const maxCourses = nval(data.profile.maxPackageCourses, 3);
            const protectThreshold = nval(data.profile.highIntensityProtectThreshold, 8);
            const protectAcceptable = nval(data.profile.protectAcceptableFatigue, 4);
            const availableClasses = getClassesForDate(d);
            const selfServiceClasses = ["自助力量", "自助跑步", "Z2单车/椭圆机", "快走/坡走", "瑜伽静态拉伸", "普拉提核心"];
            const allCandidates = [...new Set([...availableClasses, ...selfServiceClasses])];
            const filtered = allCandidates.filter(name => {
                const reqCombat = getRequiredCombat(name);
                return reqCombat <= combat;
            });
            const scored = filtered.map(name => {
                const p = classPreset(name);
                const value = nval(p.hyrox, 0) * 0.6 + nval(p.met, 5) * 0.4;
                return { name, value, p };
            }).sort((a, b) => b.value - a.value);
            const packageItems = [];
            let totalALU = 0;
            let totalTime = 0;
            let avgFatigue = 0;
            for (const item of scored) {
                if (packageItems.length >= maxCourses) break;
                const itemALU = item.p.duration * item.p.met * ((item.p.rpeMin + item.p.rpeMax) / 2 / 10);
                const itemTime = item.p.duration;
                if (totalALU + itemALU > budget) continue;
                if (totalTime + itemTime > 240) continue;
                if (avgFatigue >= protectThreshold && item.p.fatigue > protectAcceptable) continue;
                packageItems.push(item);
                totalALU += itemALU;
                totalTime += itemTime;
                avgFatigue = packageItems.reduce((sum, i) => sum + i.p.fatigue, 0) / packageItems.length;
            }
            if (packageItems.length === 0) {
                return { items: [{ name: "休息/轻度拉伸", p: classPreset("瑜伽静态拉伸") }], totalALU: 0, totalTime: 0, fallback: true };
            }
            return { items: packageItems, totalALU, totalTime, fallback: false };
        }

        function predictNextDayAcute(d) {
            const acuteRaw = getAcuteFatigue(d, true);
            const decayRate = nval(data.profile.acuteDecayRate, 0.5);
            const conversion = nval(data.profile.acuteConversion, 0.2);
            const personalMax = getPersonalMax();
            const coef = conversion * 100 / (personalMax * 0.5);
            const todayDTL = calcDTL(d);
            return Math.min(100, Math.round(((acuteRaw + todayDTL * coef) * decayRate) * 10) / 10);
        }

        function predictNextDayChronic(d) {
            const todayLog = data.logs[d];
            const todayActs = todayLog ? getActivitiesFromLog(todayLog) : [];
            const todayTL = calcTL(todayActs);
            const workAdd = getWorkAddition(d);
            const todayDTL = todayTL + workAdd;

            const tomorrow = addDays(d, 1);
            const windowDays = 28;
            let clSum = 0;
            let clValidDays = 0;
            for (let i = 1; i <= windowDays; i++) {
                const date = addDays(tomorrow, -i);
                if (date >= d) {
                    clSum += todayDTL;
                    clValidDays++;
                } else if (data.logs[date]) {
                    clSum += calcDTL(date);
                    clValidDays++;
                }
            }
            const newCL28 = clValidDays === 0 ? 0 : clValidDays < windowDays ? (clSum / clValidDays) * 7 : clSum / 4;

            let al7Sum = todayDTL;
            for (let i = 1; i <= 6; i++) {
                al7Sum += calcDTL(addDays(d, -i));
            }
            const newAL7 = al7Sum;

            const newACWR = newAL7 / Math.max(newCL28, 1);
            const newRS = newCL28 / (getPersonalMax() * 7);
            const newOFS = 0.7 * newACWR + 0.3 * newRS;
            const mapFactor = nval(data.profile.longTermMapFactor, 15);
            return Math.min(100, newOFS * mapFactor);
        }

        function predictNextDaySleepPenalty(d) {
            const sleepTarget = nval(data.profile.sleepTargetHours, 7);
            const predictSleepHours = 6.5;
            const penaltyPerHour = nval(data.profile.sleepPenaltyPerHour, 5);
            return Math.max(0, (sleepTarget - predictSleepHours) * penaltyPerHour);
        }

        function predictNextDayFatigue(d) {
            const acute = predictNextDayAcute(d);
            const chronic = predictNextDayChronic(d);
            const shortWeight = nval(data.profile.shortTermWeight, 0.7);
            const longWeight = nval(data.profile.longTermWeight, 0.3);
            const sleepPenalty = predictNextDaySleepPenalty(d);
            return Math.min(100, shortWeight * acute + longWeight * chronic + sleepPenalty);
        }

        function calcPreviewFatigue(d, activities) {
            return calcPreviewFatigueDetailed(d, activities).total;
        }

        function calcPreviewFatigueDetailed(d, activities) {
            const draftTL = calcTL(activities);
            const workAdd = getWorkAddition(d);
            const draftDTL = draftTL + workAdd;
            const decayRate = nval(data.profile.acuteDecayRate, 0.5);
            const conversion = nval(data.profile.acuteConversion, 0.2);
            const personalMax = getPersonalMax();
            const coef = conversion * 100 / (personalMax * 0.5);
            const currentAcute = getAcuteFatigue(d);
            const todayAcuteRaw = getAcuteFatigue(d, true);
            const draftAcuteIncrement = draftDTL * coef;
            const adjustedTodayAcute = todayAcuteRaw + draftAcuteIncrement;
            const previewAcute = adjustedTodayAcute * decayRate;

            const tomorrow = addDays(d, 1);
            const windowDays = 28;
            let clSum = 0;
            let clValidDays = 0;
            for (let i = 1; i <= windowDays; i++) {
                const date = addDays(tomorrow, -i);
                if (date >= d) {
                    clSum += draftDTL;
                    clValidDays++;
                } else if (data.logs[date]) {
                    clSum += calcDTL(date);
                    clValidDays++;
                }
            }
            const cl28WithoutToday = getCL28(d);
            const newCL28 = clValidDays === 0 ? 0 : clValidDays < windowDays ? (clSum / clValidDays) * 7 : clSum / 4;

            let al7Sum = draftDTL;
            for (let i = 1; i <= 6; i++) {
                al7Sum += calcDTL(addDays(d, -i));
            }
            const al7WithoutToday = al7Sum - draftDTL;
            const newAL7 = al7Sum;

            const newACWR = newAL7 / Math.max(newCL28, 1);
            const newRS = newCL28 / (personalMax * 7);
            const newOFS = 0.7 * newACWR + 0.3 * newRS;
            const mapFactor = nval(data.profile.longTermMapFactor, 15);
            const previewChronic = Math.min(100, newOFS * mapFactor);
            const sleepTarget = nval(data.profile.sleepTargetHours, 7);
            const previewSleepPenalty = Math.max(0, (sleepTarget - 6.5) * nval(data.profile.sleepPenaltyPerHour, 5));
            const shortWeight = nval(data.profile.shortTermWeight, 0.7);
            const longWeight = nval(data.profile.longTermWeight, 0.3);
            const total = Math.min(100, shortWeight * previewAcute + longWeight * previewChronic + previewSleepPenalty);
            
            return {
                total: total,
                breakdown: {
                    draftTL: Math.round(draftTL * 10) / 10,
                    workAdd: Math.round(workAdd * 10) / 10,
                    draftDTL: Math.round(draftDTL * 10) / 10,
                    decayRate: decayRate,
                    conversion: conversion,
                    personalMax: Math.round(personalMax),
                    currentAcute: Math.round(currentAcute * 10) / 10,
                    todayAcuteRaw: Math.round(todayAcuteRaw * 10) / 10,
                    coef: Math.round(coef * 10000) / 10000,
                    draftAcuteIncrement: Math.round(draftAcuteIncrement * 10) / 10,
                    adjustedTodayAcute: Math.round(adjustedTodayAcute * 10) / 10,
                    previewAcute: Math.round(previewAcute * 10) / 10,
                    al7WithoutToday: Math.round(al7WithoutToday * 10) / 10,
                    newAL7: Math.round(newAL7 * 10) / 10,
                    cl28WithoutToday: Math.round(cl28WithoutToday * 10) / 10,
                    newCL28: Math.round(newCL28 * 10) / 10,
                    newACWR: Math.round(newACWR * 100) / 100,
                    newRS: Math.round(newRS * 100) / 100,
                    newOFS: Math.round(newOFS * 100) / 100,
                    mapFactor: mapFactor,
                    previewChronic: Math.round(previewChronic * 10) / 10,
                    sleepTarget: sleepTarget,
                    previewSleepPenalty: Math.round(previewSleepPenalty * 10) / 10,
                    shortWeight: shortWeight,
                    longWeight: longWeight,
                    acuteContribution: Math.round(shortWeight * previewAcute * 10) / 10,
                    chronicContribution: Math.round(longWeight * previewChronic * 10) / 10
                }
            };
        }

        /* =========================================================
           EPOC 计算（运动后过量氧耗）
           强度越高比例越大，加到当日总消耗
        ========================================================= */
        function calcEpoc(met, exerciseKcal) {
            const m = nval(met, 0);
            if (m <= 0 || exerciseKcal <= 0) return 0;
            let ratio = 0.05; // MET<5: 5%
            if (m >= 10) ratio = 0.15;
            else if (m >= 8) ratio = 0.12;
            else if (m >= 5) ratio = 0.08;
            return Math.round(exerciseKcal * ratio);
        }

        /* =========================================================
           步数修正：从总步数中扣除运动距离对应的步数
        ========================================================= */
        function correctedSteps(rawSteps, totalDistanceKm, stepLengthM) {
            const steps = nval(rawSteps, 0);
            const distKm = nval(totalDistanceKm, 0);
            const sl = nval(stepLengthM, 0.75);
            if (steps <= 0 || distKm <= 0 || sl <= 0) return steps;
            const exerciseSteps = Math.round((distKm * 1000) / sl);
            return Math.max(0, steps - exerciseSteps);
        }

        /* =========================================================
           数据结构、兼容与存储
        ========================================================= */
        function defaultData() {
            return {
                meta: { version: VERSION, updatedAt: nowISO() },
                profile: deepClone(DEFAULT_PROFILE),
                presets: deepClone(CLASS_PRESETS),
                schedule: {},
                classes: {},
                logs: {},
                bodyStats: {} // 新增：身体维度数据
            };
        }

        function normalizeScheduleItem(x) {
            if (!x) return null;
            if (x.workPhase) {
                return {
                    cycleDay: nval(x.cycleDay, 1),
                    workPhase: x.workPhase,
                    work: !!x.work,
                    canTrain: !!x.canTrain,
                    nightShift: !!x.nightShift,
                    trainWindow: x.canTrain ? (x.trainWindow || DEFAULT_PROFILE.trainWindow) : "",
                    note: x.note || "",
                    updatedAt: x.updatedAt || ""
                };
            }
            const cd = ((nval(x.cycleDay || x.day, 1) - 1) % 4) + 1;
            return scheduleTemplate(cd, !!x.nightShift, x.updatedAt || "", x.note || "");
        }

        function scheduleTemplate(cycleDay, nightShift = false, updatedAt = "", note = "") {
            const cd = nval(cycleDay, 1);
            if (cd === 1) return { cycleDay: 1, workPhase: "work1", work: true, canTrain: false, nightShift: false,
                trainWindow: "", note, updatedAt };
            if (cd === 2) return { cycleDay: 2, workPhase: "work2", work: true, canTrain: true, nightShift: !!nightShift,
                trainWindow: DEFAULT_PROFILE.trainWindow, note, updatedAt };
            if (cd === 3) return { cycleDay: 3, workPhase: "rest1", work: false, canTrain: true, nightShift: false,
                trainWindow: DEFAULT_PROFILE.trainWindow, note, updatedAt };
            return { cycleDay: 4, workPhase: "rest2", work: false, canTrain: true, nightShift: false, trainWindow: DEFAULT_PROFILE
                    .trainWindow, note, updatedAt };
        }

        function normalizeClassRecord(v) {
            if (!v) return { items: [], updatedAt: "" };
            if (Array.isArray(v)) {
                return { items: v.map(oldNameMap).filter(Boolean), updatedAt: "" };
            }
            if (Array.isArray(v.items)) {
                return {
                    items: v.items.map(it => {
                        if (typeof it === "string") return oldNameMap(it);
                        if (it && it.name) return oldNameMap(it.name);
                        return "";
                    }).filter(Boolean),
                    updatedAt: v.updatedAt || ""
                };
            }
            return { items: [], updatedAt: "" };
        }

        function getClassesForDate(d) { return normalizeClassRecord(data.classes?.[d]).items }

        function setClassesForDate(d, items, ts = nowISO()) {
            data.classes[d] = { items: Array.from(new Set((items || []).map(oldNameMap).filter(Boolean))), updatedAt: ts };
        }

        function normalizeActivity(a, presets) {
            const type = oldNameMap(a?.type || a?.name || "");
            const p = classPreset(type, presets);
            return {
                type: type || "其他",
                focus: a?.focus || a?.privateFocus || "",
                min: nval(a?.min ?? a?.minutes ?? a?.actualMinutes ?? p.duration, 0),
                rpe: nval(a?.rpe ?? a?.actualRpe ?? Math.round((p.rpeMin + p.rpeMax) / 2), 0),
                distanceKm: nval(a?.distanceKm ?? a?.run ?? a?.runKm, 0), // 兼容旧字段 run/runKm
                ton: nval(a?.ton ?? a?.tonnage, 0),
                wallBall: nval(a?.wallBall ?? a?.wb, 0),
                carry: nval(a?.carry, 0),
                row: nval(a?.row, 0),
                ski: nval(a?.ski, 0),
                garminKcal: nval(a?.garminKcal, 0), // 新增：佳明手表热量
                note: a?.note || ""
            };
        }

        function getActivitiesFromLog(log, presets) {
            if (!log) return [];
            if (Array.isArray(log.activities)) return log.activities.map(a => normalizeActivity(a, presets)).filter(a => a.type && a
                .type !== "休息");
            if (log.actualType && log.actualType !== "未训练") {
                return [normalizeActivity({
                    type: log.actualType,
                    focus: log.privateFocus,
                    min: log.actualMinutes,
                    rpe: log.actualRpe,
                    distanceKm: log.distanceKm ?? log.runKm,
                    ton: log.tonnage,
                    wallBall: log.wallBall,
                    carry: log.carry,
                    garminKcal: log.garminKcal
                }, presets)];
            }
            return [];
        }

        function summarizeActivities(acts, presets) {
            const arr = (acts || []).map(a => normalizeActivity(a, presets)).filter(a => a.type && a.type !== "休息");
            const totalMin = arr.reduce((s, a) => s + nval(a.min), 0);
            const rpeDen = arr.reduce((s, a) => s + (a.min > 0 ? a.min : 0), 0);
            const avgRpe = rpeDen ? +(arr.reduce((s, a) => s + nval(a.rpe) * nval(a.min), 0) / rpeDen).toFixed(1) : 0;
            const calcActTL = (a) => {
                const p = classPreset(a.type, presets);
                return nval(a.min, 0) * nval(p.met, 5) * (nval(a.rpe, 0) / 10);
            };
            return {
                activities: arr,
                totalMin,
                avgRpe,
                distanceKm: +arr.reduce((s, a) => s + nval(a.distanceKm), 0).toFixed(1),
                ton: Math.round(arr.reduce((s, a) => s + nval(a.ton), 0)),
                wallBall: Math.round(arr.reduce((s, a) => s + nval(a.wallBall), 0)),
                carry: Math.round(arr.reduce((s, a) => s + nval(a.carry), 0)),
                row: Math.round(arr.reduce((s, a) => s + nval(a.row), 0)),
                ski: Math.round(arr.reduce((s, a) => s + nval(a.ski), 0)),
                totalGarminKcal: Math.round(arr.reduce((s, a) => s + nval(a.garminKcal), 0)),
                totalTL: Math.round(arr.reduce((s, a) => s + calcActTL(a), 0)),
                main: arr.slice().sort((a, b) => nval(b.min) - nval(a.min))[0]?.type || "休息",
                privateFocus: arr.find(a => a.type === "私教力量" && a.focus)?.focus || ""
            };
        }

        function normalizeBodyStatRecord(v) {
            if (!v) return { weight: 0, bodyFatPercent: 0, bodyFatMass: 0, muscleMass: 0, skeletalMuscleMass: 0, chest: 0,
                waist: 0, hip: 0, updatedAt: "" };
            return {
                weight: nval(v.weight, 0),
                bodyFatPercent: nval(v.bodyFatPercent, 0),
                bodyFatMass: nval(v.bodyFatMass, 0),
                muscleMass: nval(v.muscleMass, 0),
                skeletalMuscleMass: nval(v.skeletalMuscleMass, 0),
                chest: nval(v.chest, 0),
                waist: nval(v.waist, 0),
                hip: nval(v.hip, 0),
                updatedAt: v.updatedAt || ""
            };
        }

        function mergeData(obj) {
            const d = defaultData();
            const s = obj || {};
            d.meta = { ...d.meta, ...(s.meta || {}), version: VERSION };
            d.profile = { ...d.profile, ...(s.profile || {}) };
            if (!Array.isArray(d.profile.ptOrder) || !d.profile.ptOrder.length) d.profile.ptOrder = ["胸", "背", "腿", "肩"];
            d.presets = { ...deepClone(CLASS_PRESETS), ...(s.presets || {}) };
// 保留旧数据中的 _updatedAt 字段，若无则设为空
if (s.presets && s.presets._updatedAt) {
    d.presets._updatedAt = s.presets._updatedAt;
} else if (!d.presets._updatedAt) {
    d.presets._updatedAt = "";
}

            Object.entries(s.schedule || {}).forEach(([k, v]) => {
                const item = normalizeScheduleItem(v);
                if (item) d.schedule[k] = item;
            });

            Object.entries(s.classes || {}).forEach(([k, v]) => {
                const r = normalizeClassRecord(v);
                d.classes[k] = { items: r.items, updatedAt: r.updatedAt || "" };
            });

            Object.entries(s.logs || {}).forEach(([k, v]) => {
                const acts = getActivitiesFromLog(v, d.presets);
                const sum = summarizeActivities(acts, d.presets);
                d.logs[k] = {
                    ...(v || {}),
                    done: v?.done !== false,
                    weight: nval(v?.weight, 0),
                    waist: nval(v?.waist, 0),
                    sleepHours: nval(v?.sleepHours, 0),
                    status: v?.status || "",
                    steps: nval(v?.steps, 0),
                    caloriesIn: nval(v?.caloriesIn, 0),
                    note: v?.note || "",
                    activities: sum.activities,
                    actualType: sum.main,
                    actualMinutes: sum.totalMin,
                    actualRpe: sum.avgRpe || nval(v?.actualRpe, 0),
                    privateFocus: sum.privateFocus || v?.privateFocus || "",
                    distanceKm: sum.distanceKm,
                    tonnage: sum.ton,
                    wallBall: sum.wallBall,
                    carry: sum.carry,

                    console.error("Failed to parse localStorage data:", e);

            }

            }
            return defaultData();

            data.schedule = {};
            for (let i = 0; i < days; i++) {
                const d = addDays(start, i);
                const cd = ((startDay - 1 + i) % 4) + 1;
                const day2Index = Math.floor((startDay - 1 + i) / 4);
                let night = false;
                if (cd === 2) {
                    if (nightMode === "first") night = day2Index % 2 === 0;
                    if (nightMode === "second") night = day2Index % 2 === 1;
                    if (nightMode === "none") night = false;

        function isHighIntensityType(t) {
            const p = classPreset(t);
            return ["hiit", "wallball", "conditioning", "hyroxPower", "hyroxEngine", "hyroxSimulation"].includes(p.tag) ||
                nval(p.rpeMin) >= 7;

        function isStrengthType(t) {

                "BodyPump", "TRX功能性训练"
            ].includes(t);

        function nextPrivateFocus(d) {
            const order = Array.isArray(data.profile.ptOrder) && data.profile.ptOrder.length ? data.profile.ptOrder : ["胸",
                "背", "腿", "肩"
            ];
            const rows = Object.entries(data.logs || {}).filter(([date]) => date < d).sort((a, b) => b[0].localeCompare(a[
            0]));
            for (const [, log] of rows) {
                const pt = getActivitiesFromLog(log).find(a => a.type === "私教力量" && a.focus);
                if (pt) {
                    const idx = order.indexOf(pt.focus);
                    return order[(idx + 1 + order.length) % order.length] || order[0];
                }
            }
            return order[0];
        }

       
function decideRole(d, s, tr) {
    const combat = calcCombatPower(d);
    const fatigue = calcFatigueScore(d);
    
    if (!s) return "no_train";
    if (!tr.canTrain) return "no_train";
    
    const todayLog = data.logs[d];
    const todayStatus = todayLog?.status || "正常";
    if (todayStatus === "生病/不适") return "recovery";
    
    if (combat < 30) return "recovery";
    if (combat < 50) return "z2";
    
    if (s.workPhase === "work2") {
        if (combat >= 70) return "hyrox";
        return "strength";
    }
    
    if (s.workPhase === "rest1") {
        if (combat >= 70) return "hyrox";
        if (combat >= 50) return "strength";
        return "z2";
    }
    
    if (s.workPhase === "rest2") {
        if (combat >= 70) return "hyrox";
        if (combat >= 50) return "strength";
        if (combat >= 30) return "z2";
        return "recovery";
    }
    
    return "recovery";
}
        function dayHadHighIntensity(d) {
            const acts = getActivitiesFromLog(data.logs[d]);
            return acts.some(a => isHighIntensityType(a.type) || nval(a.rpe) >= 8);
        }

        function roleLabel(role) { return ROLE_META[role]?.label || role }

        function classScoreForRole(name, role, d) {
            const p = classPreset(name);
            const combat = calcCombatPower(d);
            const required = getRequiredCombat(name);
            const budget = getDailyBudget(d);
            const itemALU = p.duration * p.met * ((p.rpeMin + p.rpeMax) / 2 / 10);
            
            if (required > combat) return -100;
            if (itemALU > budget) return -100;
            
            let score = 50;
            
            if (role === "no_train" || role === "rest") {
                if (name === "瑜伽静态拉伸") score += 30;
                if (name === "普拉提核心") score += 20;
                return score;
            }
            
            if (role === "recovery") {
                if (["瑜伽静态拉伸", "普拉提核心", "快走/坡走"].includes(name)) score += 30;
                if (p.fatigue <= 3) score += 10;
            }
            
            if (role === "z2") {
                if (["Z2单车/椭圆机", "快走/坡走", "自助跑步"].includes(name)) score += 30;
                if (["瑜伽静态拉伸", "普拉提核心"].includes(name)) score += 10;
            }
            
            if (role === "strength") {
                if (name === "私教力量") score += 30;
                if (["BodyPump", "TRX功能性训练", "自助力量"].includes(name)) score += 20;
            }
            
            if (role === "hyrox") {
                if (["HYROX Engine", "HYROX Power", "循环训练", "高能药球", "战绳训练", "BodyCombat", "TRX功能性训练"].includes(name)) score += 30;
                if (name === "HYROX Complete") score += combat >= 80 ? 20 : -30;
            }
            
            if (role === "conditioning") {
                if (["循环训练", "BodyCombat", "BodyPump", "TRX功能性训练", "战绳训练"].includes(name)) score += 30;
                if (["HYROX Engine", "HYROX Power"].includes(name)) score += 20;
            }
            
            score += nval(p.hyrox, 0) * 0.5;
            return score;
        }

      function selectBestClass(d, role, available) {
    const style = data.profile.trainingStyle || "normal";
    const minScore = style === 'aggressive' ? 5 : (style === 'conservative' ? 10 : 8);

    const scored = (available || []).map(name => ({ name, score: classScoreForRole(name, role, d) }))
        .filter(x => x.score >= minScore)
        .sort((a, b) => b.score - a.score);
    return scored[0]?.name || "";
}

        function selfPlanForRole(d, role, s) {
            const focus = nextPrivateFocus(d);
            if (role === "no_train") return { name: "休息", role, focus: "", duration: 0, rpe: 0, items: [
                    ["安排", "不安排正式训练"], ["活动", "6000-8000步 + 10分钟拉伸"], ["原因", s ? "上班第1天，上午无法训练" : "未排班"]
                ] };
            if (role === "recovery") return { name: "瑜伽静态拉伸", role, focus: "", duration: 30, rpe: 3, items: [

                    ], ["目标", "促进恢复，不制造额外疲劳"]
                ] };
            if (role === "z2") return { name: "Z2单车/椭圆机", role, focus: "", duration: 45, rpe: 5, items: [
                    ["主项", "单车/椭圆机/坡走 40-60分钟"], ["心率",
                        `Z2 ${data.profile.z2HrLow}-${data.profile.z2HrHigh} bpm`
                    ], ["目标", "减脂与有氧基础，不要冲到阈值"]
                ] };
            if (role === "strength") return { name: "自助力量", role, focus, duration: 60, rpe: 7, items: [
                    ["主项", `自助力量 ${focus} 专项 60分钟`], ["强度", "RPE 6-8，保留1-3次余力"], ["动作建议", strengthAdvice(focus)]
                ] };
            if (role === "hyrox") return { name: "自助跑步", role, focus: "", duration: 60, rpe: 8, items: [
                    ["主项", "HYROX自助组合：跑步间歇 + 功能动作"], ["心率",
                        `大部分 ${data.profile.steadyHrLow}-${data.profile.steadyHrHigh} bpm，短时间 ${data.profile.thresholdHrLow}-${data.profile.thresholdHrHigh} bpm，避免长时间超过 LTHR ${data.profile.lthr}`
                    ], ["示例", "跑步 1km × 3-4 + Wall Ball / Carry / Row / Ski 选2项"]
                ] };
            if (role === "conditioning") return { name: "自助跑步", role, focus: "", duration: 45, rpe: 7, items: [
                    ["主项", "中等强度跑步或综合体能 45分钟"], ["心率",
                        `以 ${data.profile.steadyHrLow}-${data.profile.steadyHrHigh} bpm 为主，不追求爆表`
                    ], ["目标", "补训练量但不过度堆疲劳"]
                ] };
            return selfPlanForRole(d, "recovery", s);
        }

        function strengthAdvice(focus) {
            if (focus === "胸") return `卧推 ${data.profile.bench}kg附近 4×6-8；上斜推 3×8-10；夹胸 3×12-15`;
            if (focus === "背") return `高位下拉 ${data.profile.pull}kg附近 4×8-10；划船 4×8；面拉 3×15`;
            if (focus === "腿") return `深蹲 ${data.profile.squat}kg附近 4×5-8；RDL 3×8；箭步蹲 3×10/侧`;
            if (focus === "肩") return `推举 4×6-8；侧平举 4×12-15；反向飞鸟 3×15`;
            return "推/拉/腿各选1-2个动作";
        }

        function buildClassPlan(name, role, d, s) {
            const p = classPreset(name);
            const focus = name === "私教力量" ? nextPrivateFocus(d) : "";
            let hr = "";
            if (["瑜伽静态拉伸", "普拉提核心"].includes(name)) hr =
                `恢复区 ${data.profile.recoveryHrLow}-${data.profile.recoveryHrHigh} bpm`;
            else if (["Z2单车/椭圆机", "快走/坡走"].includes(name)) hr =
                `Z2 ${data.profile.z2HrLow}-${data.profile.z2HrHigh} bpm`;
            else if (["HYROX Engine", "HYROX Power"].includes(name)) hr =
                `大部分 ${data.profile.steadyHrLow}-${data.profile.steadyHrHigh}，短时间 ${data.profile.thresholdHrLow}-${data.profile.thresholdHrHigh}，避免长期超过 ${data.profile.lthr}`;
            else if (name === "HYROX Complete") hr =
            `可短时间超过 ${data.profile.lthr}，但注意配速；前后安排恢复`;
            else hr =
                `RPE ${p.rpeMin}-${p.rpeMax}，如心率持续超过 ${data.profile.lthr} 且无法回落，请主动降强度`;
            return {
                name,
                role,
                focus,
                duration: p.duration,
                rpe: Math.round((p.rpeMin + p.rpeMax) / 2),
                items: [
                    ["课程",
                        `${name}${focus?`（${focus}专项）`:""} ${p.duration}分钟`
                    ],
                    ["强度", `RPE ${p.rpeMin}-${p.rpeMax}`],
                    ["心率", hr],
                    ["说明", s?.nightShift ? "当天夜班，建议保守完成，不要硬顶。" : "优先选择已有课程/私教。"]
                ]
            };
        }

        function makePlan(d) {
            const s = normalizeScheduleItem(data.schedule[d]);
            const tr = getTrainability(d);
            const role = decideRole(d, s, tr);
            const available = getClassesForDate(d);
            const style = data.profile.trainingStyle || "normal";
            const selected = tr.canTrain ? selectBestClass(d, role, available) : "";
            const self = selfPlanForRole(d, role, s);
            const final = selected ? buildClassPlan(selected, role, d, s) : self;
            const energy = estimateEnergy(d, final, s);
            let extraPlan = null;
            if (style === "aggressive" && tr.canTrain && role !== "no_train" && role !== "recovery") {
                const secondAvailable = available.filter(c => c !== selected);
                if (secondAvailable.length > 0) {
                    const second = selectBestClass(d, role, secondAvailable);
                    if (second) extraPlan = buildClassPlan(second, role, d, s);
                }
            }
            return { date: d, schedule: s, trainability: tr, role, available, selected, plan: final, selfPlan: self,
                energy, extraPlan };
        }

        /* =========================================================
           热量、饮食建议（含EPOC、佳明热量、步数修正）
        ========================================================= */
        function rpeFactor(rpe) {
            rpe = nval(rpe, 0);
            if (rpe <= 5) return .9;
            if (rpe <= 7) return 1;
            if (rpe === 8) return 1.06;
            return 1.12;
        }

        function exerciseKcal(type, min, rpe, garminKcal = 0) {
            // 如果记录了佳明热量，优先使用
            if (nval(garminKcal, 0) > 0) return nval(garminKcal, 0);
            const p = classPreset(type);
            const bw = nval(data.profile.bodyWeight, 84);
            return Math.round(nval(p.met, 5) * 3.5 * bw / 200 * nval(min, 0) * rpeFactor(rpe));
        }

        function epocFromActivity(type, min, rpe, garminKcal = 0) {
            const p = classPreset(type);
            const exKcal = exerciseKcal(type, min, rpe, garminKcal);
            return calcEpoc(p.met, exKcal);
        }

        function stepKcal(steps) {
            const bw = nval(data.profile.bodyWeight, 84);
            const km = nval(steps, 0) * nval(data.profile.stepLengthM, .75) / 1000;
            return Math.round(km * bw * .5);
        }

        function workExtraKcal(s) {
            if (!s) return 0;
            if (s.nightShift) return nval(data.profile.nightShiftExtraKcal, 180);
            if (s.work) return nval(data.profile.workDayExtraKcal, 120);
            return nval(data.profile.restDayExtraKcal, 0);
        }

        function estimateEnergy(d, plan, s) {
            const role = plan.role || "rest";
            const meta = ROLE_META[role] || ROLE_META.rest;
            const plannedSteps = nval(meta.steps, 8000);
            const ex = exerciseKcal(plan.name, plan.duration, plan.rpe);
            const epocP = calcEpoc(classPreset(plan.name).met, ex);
            const stepsK = stepKcal(plannedSteps);
            const extra = workExtraKcal(s);
            const tdee = Math.round(nval(data.profile.bmr, 1749) + ex + epocP + stepsK + extra);
            const targetIn = Math.max(nval(meta.minIn, 1900), tdee - nval(meta.deficit, 400));

            const log = data.logs[d];
            let actual = null;
            if (log && diffDays(d, todayStr()) <= 0) {
                const acts = getActivitiesFromLog(log);
                const sum = summarizeActivities(acts);
                // 计算每项运动的消耗（含佳明热量）和EPOC
                let exA = 0,
                    epocA = 0;
                acts.forEach(a => {
                    exA += exerciseKcal(a.type, a.min, a.rpe, a.garminKcal);
                    epocA += epocFromActivity(a.type, a.min, a.rpe, a.garminKcal);
                });
                // 步数修正
                const rawSteps = nval(log.steps, 0);
                const corrSteps = correctedSteps(rawSteps, sum.distanceKm, nval(data.profile.stepLengthM, 0.75));
                const stepsAK = stepKcal(corrSteps);
                const tdeeA = Math.round(nval(data.profile.bmr, 1749) + exA + epocA + stepsAK + extra);
                const inA = nval(log.caloriesIn, 0);
                actual = {
                    sum,
                    exercise: exA,
                    epoc: epocA,
                    steps: rawSteps,
                    correctedSteps: corrSteps,
                    stepsK: stepsAK,
                    tdee: tdeeA,
                    caloriesIn: inA,
                    deficit: inA ? Math.round(tdeeA - inA) : null
                };
            }
            return {
                planned: { steps: plannedSteps, exercise: ex, epoc: epocP, stepsK, extra, tdee, targetIn, deficit: meta.deficit,
                    minIn: meta.minIn },
                actual
            };

        function drawStatsChart(chartData) {
            const canvas = document.getElementById("statsChart");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            const dpr = window.devicePixelRatio || 1;
            let rect = canvas.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) {
    canvas.width = canvas.clientWidth || 600;
    canvas.height = 280;
    rect = canvas.getBoundingClientRect();
}
            canvas.width = rect.width * dpr;
            canvas.height = 320 * dpr;
            ctx.scale(dpr, dpr);
            const w = rect.width;
            const h = 320;
            const pad = { top: 20, right: 30, bottom: 50, left: 55 };
            const pw = w - pad.left - pad.right;
            const ph = h - pad.top - pad.bottom;

            // 找范围
            let maxVal = 0,
                minDef = Infinity;
            chartData.forEach(d => {
                if (d.tdee > maxVal) maxVal = d.tdee;
                if (d.caloriesIn > maxVal) maxVal = d.caloriesIn;
                if (d.deficit < minDef) minDef = d.deficit;
            });
            if (maxVal === 0) maxVal = 2000;
            if (minDef === Infinity) minDef = 0;
            maxVal = Math.ceil(maxVal / 200) * 200 + 200;
            const minDefFloor = Math.floor(minDef / 200) * 200 - 200;
            const valRange = maxVal - minDefFloor;

            function xPos(i) { return pad.left + (i / Math.max(chartData.length - 1, 1)) * pw }

            function yPos(v) { return pad.top + ph - ((v - minDefFloor) / valRange) * ph }

            // 背景
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, w, h);

            // 零线
            const zeroY = yPos(0);
            ctx.strokeStyle = "#e5e7eb";
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(pad.left, zeroY);
            ctx.lineTo(pad.left + pw, zeroY);
            ctx.stroke();
            ctx.setLineDash([]);

            // Y轴标签
            ctx.fillStyle = "#6b7280";
            ctx.font = "10px -apple-system,sans-serif";
            ctx.textAlign = "right";
            for (let v = minDefFloor; v <= maxVal; v += Math.round(valRange / 5)) {
                const y = yPos(v);
                ctx.fillText(v, pad.left - 5, y + 3);
                ctx.strokeStyle = "#f3f4f6";
                ctx.beginPath();
                ctx.moveTo(pad.left, y);
                ctx.lineTo(pad.left + pw, y);
                ctx.stroke();
            }

            // X轴标签
            ctx.textAlign = "center";
            const step = Math.max(1, Math.floor(chartData.length / 8));
            chartData.forEach((d, i) => {
                if (i % step === 0 || i === chartData.length - 1) {
                    const x = xPos(i);
                    ctx.fillText(d.date.slice(5), x, h - pad.bottom + 16);
                }
            });

            // 柱状图 - TDEE 和 摄入 并排显示
            const barGroupW = Math.max(8, pw / chartData.length * 0.6);
            const barW = barGroupW / 2;
            chartData.forEach((d, i) => {
                const centerX = xPos(i);
                // TDEE柱体（左半边）
                const x1 = centerX - barGroupW / 2;
                const y1 = yPos(d.tdee);
                const bh1 = zeroY - y1;
                ctx.fillStyle = "rgba(37,99,235,0.7)";
                ctx.fillRect(x1, y1, barW, bh1);

                // 摄入柱体（右半边）
                if (d.caloriesIn > 0) {
                    const x2 = centerX;
                    const y2 = yPos(d.caloriesIn);
                    const bh2 = zeroY - y2;
                    ctx.fillStyle = "rgba(22,163,74,0.7)";
                    ctx.fillRect(x2, y2, barW, bh2);
                }
            });

            // 折线 - 缺口
            if (chartData.some(d => d.deficit !== 0)) {
                ctx.strokeStyle = "#f97316";
                ctx.lineWidth = 2;
                ctx.beginPath();
                chartData.forEach((d, i) => {
                    const x = xPos(i);
                    const y = yPos(d.deficit);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();
                // 点
                chartData.forEach((d, i) => {
                    if (!d.deficit) return;
                    const x = xPos(i);
                    const y = yPos(d.deficit);
                    ctx.fillStyle = "#f97316";
                    ctx.beginPath();
                    ctx.arc(x, y, 3, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // 图例
            const lx = pad.left;
            const ly = pad.top - 2;
            ctx.fillStyle = "rgba(37,99,235,0.7)";
            ctx.fillRect(lx, ly, 12, 10);
            ctx.fillStyle = "#111827";
            ctx.textAlign = "left";
            ctx.fillText("TDEE消耗", lx + 16, ly + 9);
            ctx.fillStyle = "rgba(22,163,74,0.7)";
            ctx.fillRect(lx + 90, ly, 12, 10);
            ctx.fillText("摄入", lx + 106, ly + 9);
            ctx.strokeStyle = "#f97316";
            ctx.beginPath();
            ctx.moveTo(lx + 155, ly + 5);
            ctx.lineTo(lx + 175, ly + 5);
            ctx.stroke();
            ctx.fillStyle = "#f97316";
            ctx.beginPath();
            ctx.arc(lx + 165, ly + 5, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#111827";
            ctx.fillText("缺口", lx + 179, ly + 9);
        }

        function drawFatigueTrendChart(data) {
            const canvas = document.getElementById("fatigueTrendChart");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            const paramConfig = {
                acute: { label: "急性疲劳", color: "#ef4444" },
                chronic: { label: "慢性疲劳", color: "#8b5cf6" },
                dtl: { label: "每日负荷", color: "#f59e0b" },
                acwr: { label: "ACWR", color: "#06b6d4" },
                rs: { label: "RS", color: "#84cc16" },
                ofs: { label: "OFS", color: "#14b8a6" },
                combat: { label: "战斗力", color: "#2563eb" },
                fatigue: { label: "总疲劳分", color: "#dc2626" }
            };
            const selectedParams = [];
            const checkboxes = document.querySelectorAll("#fatigueChartParams input[type=checkbox]");
            checkboxes.forEach(cb => { if (cb.checked && paramConfig[cb.value]) selectedParams.push(cb.value); });
            if (!selectedParams.length) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                canvas.width = 600;
                canvas.height = 340;
                ctx.fillStyle = "#6b7280";
                ctx.font = "14px -apple-system,sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("请选择至少一个参数", 300, 170);
                return;
            }

            const dpr = window.devicePixelRatio || 1;
            let rect = canvas.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) {
                canvas.style.width = "100%";
                canvas.style.height = "340px";
                rect = { width: 600, height: 340 };
            }
            canvas.width = rect.width * dpr;
            canvas.height = 340 * dpr;
            ctx.scale(dpr, dpr);
            const w = rect.width, h = 340;
            const pad = { top: 40, right: 60, bottom: 55, left: 60 };
            const pw = w - pad.left - pad.right;
            const ph = h - pad.top - pad.bottom;

            let minVal = Infinity, maxVal = -Infinity;
            data.forEach(d => {
                selectedParams.forEach(p => {
                    const v = d[p];
                    if (v != null && !isNaN(v) && v < minVal) minVal = v;
                    if (v != null && !isNaN(v) && v > maxVal) maxVal = v;
                });
            });
            if (!isFinite(minVal) || !isFinite(maxVal)) { minVal = 0; maxVal = 100; }
            if (minVal === maxVal) { minVal -= 10; maxVal += 10; }
            const range = maxVal - minVal;
            minVal = minVal - range * 0.05;
            maxVal = maxVal + range * 0.05;
            const valRange = maxVal - minVal;

            const xPos = i => pad.left + (i / Math.max(data.length - 1, 1)) * pw;
            const yPos = v => pad.top + ph - ((v - minVal) / valRange) * ph;

            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, w, h);

            const gridLines = 6;
            ctx.strokeStyle = "#f3f4f6";
            ctx.lineWidth = 1;
            ctx.fillStyle = "#6b7280";
            ctx.font = "10px -apple-system,sans-serif";
            ctx.textAlign = "right";
            for (let i = 0; i <= gridLines; i++) {
                const val = minVal + (valRange / gridLines) * i;
                const y = yPos(val);
                ctx.beginPath();
                ctx.moveTo(pad.left, y);
                ctx.lineTo(pad.left + pw, y);
                ctx.stroke();
                const label = val >= 100 ? Math.round(val) : val >= 10 ? val.toFixed(1) : val.toFixed(2);
                ctx.fillText(label, pad.left - 6, y + 4);
            }

            ctx.textAlign = "center";
            const labelStep = Math.max(1, Math.floor(data.length / 10));
            data.forEach((d, i) => {
                if (i % labelStep === 0 || i === data.length - 1) {
                    ctx.fillText(d.date.slice(5), xPos(i), h - pad.bottom + 18);
                }
            });

            selectedParams.forEach(p => {
                const cfg = paramConfig[p];
                ctx.strokeStyle = cfg.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                let started = false;
                data.forEach((d, i) => {
                    const v = d[p];
                    if (v == null || isNaN(v)) return;
                    const x = xPos(i);
                    const y = yPos(v);
                    if (!started) { ctx.moveTo(x, y); started = true; }
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();

                data.forEach((d, i) => {
                    const v = d[p];
                    if (v == null || isNaN(v)) return;
                    const x = xPos(i);
                    const y = yPos(v);
                    ctx.fillStyle = cfg.color;
                    ctx.beginPath();
                    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                });
            });

            let legendX = pad.left;
            selectedParams.forEach(p => {
                const cfg = paramConfig[p];
                ctx.fillStyle = cfg.color;
                ctx.fillRect(legendX, pad.top - 28, 14, 12);
                ctx.fillStyle = "#374151";
                ctx.font = "12px -apple-system,sans-serif";
                ctx.textAlign = "left";
                ctx.fillText(cfg.label, legendX + 18, pad.top - 18);
                legendX += ctx.measureText(cfg.label).width + 32;
            });

            const todayIdx = data.findIndex(d => d.date === todayStr());
            if (todayIdx >= 0) {
                const tx = xPos(todayIdx);
                ctx.strokeStyle = "rgba(156,163,175,0.4)";
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(tx, pad.top);
                ctx.lineTo(tx, pad.top + ph);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

function setBodyRange(period) {
    const today = new Date();
    let startDate;
    if (period === '1m') {
        startDate = new Date(today);
        startDate.setMonth(startDate.getMonth() - 1);
    } else if (period === '3m') {
        startDate = new Date(today);
        startDate.setMonth(startDate.getMonth() - 3);
    } else if (period === '1y') {
        startDate = new Date(today);
        startDate.setFullYear(startDate.getFullYear() - 1);
    }
    const startStr = startDate.toISOString().split('T')[0];
    const endStr = today.toISOString().split('T')[0];
    const startEl = document.getElementById("bsStart");
    const endEl = document.getElementById("bsEnd");
    if (startEl) startEl.value = startStr;
    if (endEl) endEl.value = endStr;
    updateBodyRange();
}

    const ph = h - pad.top - pad.bottom;

    // 过滤有效数据
    let minVal = Infinity, maxVal = -Infinity;
    const validRows = [];
    rows.forEach(([date, v]) => {
        const values = fields.map(f => nval(v[f], 0));
        const anyValid = values.some(val => val > 0);
        if (anyValid) {
            validRows.push([date, v]);
            values.forEach(val => {
                if (val > 0 && val < minVal) minVal = val;
                if (val > maxVal) maxVal = val;
            });
        }
    });

    if (validRows.length === 0) {
        ctx.fillStyle = "#6b7280";
        ctx.font = "14px -apple-system,sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("无有效数据", w / 2, h / 2);
        return;
    }

    const range = maxVal - minVal || 1;
    minVal = Math.floor(minVal - range * 0.08);
    maxVal = Math.ceil(maxVal + range * 0.08);
    const valRange = maxVal - minVal;

    const xPos = i => pad.left + (i / Math.max(validRows.length - 1, 1)) * pw;
    const yPos = v => pad.top + ph - ((v - minVal) / valRange) * ph;

    // 清空背景
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, w, h);

    // 网格线和Y轴标签
    const gridLines = 5;
    ctx.strokeStyle = "#f3f4f6";
    ctx.lineWidth = 1;
    ctx.fillStyle = "#6b7280";
    ctx.font = "10px -apple-system,sans-serif";
    ctx.textAlign = "right";
    for (let i = 0; i <= gridLines; i++) {
        const val = minVal + (valRange / gridLines) * i;
        const y = yPos(val);
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(pad.left + pw, y);
        ctx.stroke();
        ctx.fillText(Math.round(val), pad.left - 5, y + 3);
    }

    // X轴标签
    ctx.textAlign = "center";
    const step = Math.max(1, Math.floor(validRows.length / 8));
    validRows.forEach(([date], i) => {
        if (i % step === 0 || i === validRows.length - 1) {
            ctx.fillText(date.slice(5), xPos(i), h - pad.bottom + 16);
        }
    });

    // 绘制折线和数据点
    fields.forEach((field, fi) => {
        ctx.strokeStyle = colors[fi];
        ctx.lineWidth = 2;
        ctx.beginPath();
        let started = false;
        validRows.forEach(([, v], i) => {
            const val = nval(v[field], 0);
            if (val <= 0) return;
            const x = xPos(i), y = yPos(val);
            if (!started) { ctx.moveTo(x, y); started = true; }
            else ctx.lineTo(x, y);
        });
        ctx.stroke();

        validRows.forEach(([, v], i) => {
            const val = nval(v[field], 0);
            if (val <= 0) return;
            ctx.fillStyle = colors[fi];
            ctx.beginPath();
            ctx.arc(xPos(i), yPos(val), 3, 0, Math.PI * 2);
            ctx.fill();
        });
    });

    // 图例
    const lx = pad.left, ly = pad.top - 2;
    labels.forEach((label, fi) => {
        const ox = fi * 90;
        ctx.strokeStyle = colors[fi];
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(lx + ox, ly + 5);
        ctx.lineTo(lx + ox + 16, ly + 5);
        ctx.stroke();
        ctx.fillStyle = colors[fi];
        ctx.beginPath();
        ctx.arc(lx + ox + 8, ly + 5, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#111827";
        ctx.textAlign = "left";
        ctx.fillText(label, lx + ox + 20, ly + 9);
    });
}

            waist: nval(document.getElementById("bsWaist")?.value, 0),
            hip: nval(document.getElementById("bsHip")?.value, 0),

        };

        function mergeDateMapByUpdatedAt(localMap = {}, cloudMap = {}, normalizer = x => x) {
            const out = {};
            const keys = new Set([...Object.keys(localMap || {}), ...Object.keys(cloudMap || {})]);
            keys.forEach(k => {
                const l = normalizer(localMap[k]);
                const c = normalizer(cloudMap[k]);
                if (!l && c) { out[k] = c; return }
                if (l && !c) { out[k] = l; return }
                if (!l && !c) return;
                const cmp = newerISO(l.updatedAt, c.updatedAt);
            out[k] = cmp >= 0 ? l : c;
        });
        return out;
    }

    function mergeLogsByUpdatedAt(localLogs={}, cloudLogs={}){
        const out={};
        const keys=new Set([...Object.keys(localLogs||{}),...Object.keys(cloudLogs||{})]);
        keys.forEach(k=>{
            const l=localLogs[k];
            const c=cloudLogs[k];
            if(!l&&c){out[k]=c;return}
            if(l&&!c){out[k]=l;return}
            if(!l&&!c)return;
            const cmp=newerISO(l.updatedAt,c.updatedAt);
            out[k]=cmp>=0?l:c;
        });
        return out;
    }

    function hasUsefulContent(x){
        return !!(
            Object.keys(x?.schedule||{}).length ||
            Object.keys(x?.classes||{}).length ||
            Object.keys(x?.logs||{}).length ||
            Object.keys(x?.bodyStats||{}).length
        );
    }

    function smartMergeData(localRaw,cloudRaw){
        const local=mergeData(localRaw||{});
        const cloud=mergeData(cloudRaw||{});
        const merged=defaultData();
        merged.meta={
            version:VERSION,
            updatedAt:newerISO(local.meta?.updatedAt,cloud.meta?.updatedAt)>=0?local.meta?.updatedAt:cloud.meta?.updatedAt
        };
        merged.profile=newerISO(local.meta?.updatedAt,cloud.meta?.updatedAt)>=0
            ? {...DEFAULT_PROFILE,...cloud.profile,...local.profile}
            : {...DEFAULT_PROFILE,...local.profile,...cloud.profile};
        if(!Array.isArray(merged.profile.ptOrder)||!merged.profile.ptOrder.length)merged.profile.ptOrder=["胸","背","腿","肩"];
// 比较 presets 的时间戳字符串，保留较新的版本
const localPresetTime = local.presets?._updatedAt || "";
const cloudPresetTime = cloud.presets?._updatedAt || "";
const useLocal = newerISO(localPresetTime, cloudPresetTime) >= 0;
const newerPresets = useLocal ? local.presets : cloud.presets;
const olderPresets = useLocal ? cloud.presets : local.presets;
merged.presets = {
    ...deepClone(CLASS_PRESETS),
    ...olderPresets,
    ...newerPresets,
    _updatedAt: newerPresets._updatedAt || olderPresets._updatedAt || ""
};
        merged.schedule=mergeDateMapByUpdatedAt(local.schedule,cloud.schedule,normalizeScheduleItem);
        merged.classes=mergeDateMapByUpdatedAt(local.classes,cloud.classes,normalizeClassRecord);
        merged.logs=mergeLogsByUpdatedAt(local.logs,cloud.logs);
        merged.bodyStats=mergeDateMapByUpdatedAt(local.bodyStats,cloud.bodyStats,normalizeBodyStatRecord);
        return mergeData(merged);
    }

    async function pullRaw(){
        if(!supabaseClient)throw new Error("未配置 Supabase URL 或 ANON KEY");
        if(!syncCode)throw new Error("未绑定同步码");
        const {data:rows,error}=await supabaseClient.rpc("pull_planner_by_code",{p_code:syncCode});
        if(error)throw error;
        return rows&&rows.length?rows[0]:null;
    }

    async function pushRaw(){
        if(!supabaseClient)throw new Error("未配置 Supabase URL 或 ANON KEY");
        if(!syncCode)throw new Error("未绑定同步码");
        const {data:rows,error}=await supabaseClient.rpc("push_planner_by_code",{
            p_code:syncCode,
            p_state:mergeData(data)
        });
        if(error)throw error;
        return rows&&rows.length?rows[0]:null;
    }

    async function bindSyncCode(){
        const code=normalizeCode($("syncCodeInput")?.value||"");
        if(!code)return alert("请输入同步码");
        syncCode=code;
        localStorage.setItem(SYNC_KEY,syncCode);
        updateSyncStatus("已绑定同步码，正在从云端拉取数据...");
        
        // 新终端绑定后，只拉取云端数据，不进行智能同步（避免空数据覆盖云端）
        try {
            isSyncing = true;
            const row = await pullRaw();
            if (row && row.state) {
                cloudRevision = Number(row.revision || 0);
                data = mergeData(row.state || {});
                saveLocalOnly();
                refreshAll();
                updateSyncStatus("已绑定同步码并拉取云端数据。");
                alert("已绑定同步码，云端数据已拉取");
            } else {
                updateSyncStatus("已绑定同步码，云端暂无数据。");
                alert("已绑定同步码，云端暂无数据");
            }
        } catch (e) {
            alert("拉取失败：" + e.message);
            updateSyncStatus("绑定成功，但拉取失败：" + e.message);
        } finally {
            isSyncing = false;
        }
        
        // 绑定后标记首次会话完成，启用自动同步
        isFirstSessionCompleted = true;
        sessionStorage.setItem("hyrox_first_sync_completed", "true");
        autoSyncEnabled = true;
    }

    function unbindSyncCode(){
        if(!confirm("确定解除本机同步码绑定？不会删除云端数据。"))return;
        syncCode="";
        cloudRevision=0;
        localStorage.removeItem(SYNC_KEY);
        updateSyncStatus("已解除绑定。");
        renderSync();
    }

    async function pullCloud(){
        if(!syncCode){alert("请先绑定同步码");return}
        try{
            isSyncing=true;
            updateSyncStatus("正在从云端拉取...");
            const row=await pullRaw();
            if(!row){updateSyncStatus("云端暂无数据。");alert("云端暂无数据");return}
            cloudRevision=Number(row.revision||0);
            data=mergeData(row.state||{});
            saveLocalOnly();
            refreshAll();
            updateSyncStatus("已从云端拉取。");
            // 拉取后启用自动同步
            isFirstSessionCompleted = true;
            sessionStorage.setItem("hyrox_first_sync_completed", "true");
            autoSyncEnabled = true;
            alert("已拉取云端数据");
        }catch(e){
            alert("拉取失败："+e.message);
            updateSyncStatus("拉取失败："+e.message);
        }finally{isSyncing=false;}
    }

    async function pushCloud(ask=true){
        if(!syncCode){alert("请先绑定同步码");return}
        if(ask&&!confirm("确定上传本机数据到云端？建议优先使用智能同步。"))return;
        try{
            isSyncing=true;
            updateSyncStatus("正在上传...");
            const row=await pushRaw();
            if(row)cloudRevision=Number(row.revision||0);
            updateSyncStatus("已上传。");
            if(ask)alert("已上传");
        }catch(e){
            alert("上传失败："+e.message);
            updateSyncStatus("上传失败："+e.message);
        }finally{isSyncing=false;}
    }

    async function smartSync(){
        if(!syncCode){alert("请先绑定同步码");showTab("sync");return}
        try{
            isSyncing=true;
            updateSyncStatus("正在智能同步...");
            const row=await pullRaw();
            if(!row){
                await pushCloud(false);
                updateSyncStatus("云端无数据，已上传本机。");
                return;
            }
            cloudRevision=Number(row.revision||0);
            const cloudState=mergeData(row.state||{});
            const merged=smartMergeData(data,cloudState);
            if(!hasUsefulContent(merged)&&hasUsefulContent(cloudState)){
                throw new Error("异常空合并结果，已阻止覆盖。");
            }
            data=merged;
            saveLocalOnly();
            // 同步后调用 ensureSeed 确保本地参数不被覆盖
            ensureSeed();
            saveLocalOnly();
            const pushed=await pushRaw();
            if(pushed)cloudRevision=Number(pushed.revision||0);      
      refreshAll();
            updateSyncStatus("智能同步完成。");
        }catch(e){
            alert("智能同步失败："+e.message);
            updateSyncStatus("智能同步失败："+e.message);
        }finally{isSyncing=false;}
    }

    function scheduleAutoPush(){
        if(!syncCode||isSyncing||!supabaseClient)return;
        clearTimeout(scheduleAutoPush._timer);
        scheduleAutoPush._timer=setTimeout(async()=>{
            try{
                if(isSyncing)return;
                isSyncing=true;
                updateSyncStatus("自动上传中...");
                const row=await pushRaw();
                if(row)cloudRevision=Number(row.revision||0);
                updateSyncStatus("自动上传完成。");
            }catch(e){
                updateSyncStatus("自动上传失败："+e.message);
            }finally{isSyncing=false;}
        },1600);
    }

        if (!data.logs[d]) data.logs[d] = {};
        data.logs[d].sleepHours = sleep;

        saveData();
        renderHome();

    function updateTrainingStyle(style) {
        data.profile.trainingStyle = style;
        saveData();
        renderHome();
        renderProfile();
    }

    function saveHomeViewSettings(){
        const total=Math.max(1,Math.min(30,nval($("homeTotalDays")?.value,7)));
        const detail=Math.max(0,Math.min(total,nval($("homeDetailDays")?.value,4)));
        const offsets=String($("homeDetailOffsets")?.value||"").trim();
        data.profile.homeTotalDays=total;
        data.profile.homeDetailDays=detail;
        data.profile.homeDetailOffsets=offsets;
        saveData();
        renderHome();
    }

    function setHomeDetailPreset(n){
        const total=Math.max(n,nval(data.profile.homeTotalDays,7));
        data.profile.homeTotalDays=total;
        data.profile.homeDetailDays=n;
        data.profile.homeDetailOffsets=Array.from({length:n},(_,i)=>i).join(",");
        saveData();
        renderHome();
    }

    function setHomeDetailOffsetsPreset(offsets){
        const nums=String(offsets).split(/[,，\s]+/).map(x=>parseInt(x,10)).filter(x=>Number.isFinite(x)&&x>=0);
        const maxOffset=nums.length?Math.max(...nums):6;
        data.profile.homeTotalDays=Math.max(nval(data.profile.homeTotalDays,7),maxOffset+1);
        data.profile.homeDetailDays=nums.length;
        data.profile.homeDetailOffsets=nums.join(",");
        saveData();
        renderHome();
    }

              <div style="display:flex;justify-content:space-between">
                <span>预计总时长：<b>${pkg.totalTime} 分钟</b></span>
                <span>预计总ALU：<b>${Math.round(pkg.totalALU)}</b></span>
                <span>预计消耗：<b>${Math.round(pkg.totalTime * 5 * data.profile.bodyWeight / 60)} kcal</b></span>

            <h3>💪 战斗力信息</h3>

              <tr><td>日负荷预算</td><td><b>${budget}</b> ALU</td></tr>
              <tr><td>套餐占预算</td><td><b>${Math.round(pkg.totalALU / budget * 100)}%</b></td></tr>
              <tr><td>个人最大</td><td>${Math.round(getPersonalMax())} ALU</td></tr>
            </table>
          </div></div>
          <div class="col-12"><div class="box">

              <div style="margin-top:12px">${getPackageDecisionHtml(d)}</div>
            </details>
          </div></div>
        `;

        const bPlan = pkg.items.length === 1 ? { name: "瑜伽静态拉伸", p: classPreset("瑜伽静态拉伸") } : pkg.items[0];
        const bPlanHtml = pkg.fallback ? `` : `
          <div class="col-12"><div class="box">
            <h3>🔄 B 方案：单课精简版</h3>
            <div style="display:flex;justify-content:space-between;align-items:center">

                <b>${esc(bPlan.name)}</b>
                ${bPlan.p.tag ? pill(bPlan.p.tag, "gray") : ""}
              </div>
              <div style="display:flex;gap:8px">
                ${pill(`${bPlan.p.duration}分钟`, "blue")}
                ${pill(`MET ${bPlan.p.met}`, "purple")}

            </div>
            <div class="muted" style="margin-top:4px">${pkg.items.length > 1 ? '套餐中综合价值最高的课程' : '套餐仅1门，推荐搭配恢复拉伸'}</div>
          </div></div>
        `;

        return `
 <div class="card"><h2>${isToday?"今天详细计划：":"详细计划："}${dateLabel(d)}</h2>
  <div class="grid">
   <div class="col-3"><div class="box"><b>排班</b><br>${s?`${phaseLabel(s)} ${s.nightShift?pill("夜班","orange"):""}`:pill("未排班","orange")}</div></div>
   <div class="col-3"><div class="box"><b>训练窗口</b><br>${po.trainability.canTrain?pill(po.trainability.window,"green"):pill("不可训练","gray")}<div class="muted">${esc(po.trainability.reason)}</div></div></div>
   <div class="col-3"><div class="box"><b>当日角色</b><br>${pill(roleLabel(po.role),po.role==="hyrox"||po.role==="strength"?"green":po.role==="no_train"?"gray":"orange")}</div></div>
   <div class="col-3"><div class="box"><b>ACWR疲劳指标</b><br>ACWR: ${calcACWR(d).toFixed(2)} | RS: ${calcRS(d).toFixed(3)}<div class="muted">OFS: ${calcOFS(d).toFixed(2)}</div></div></div>
  </div>
  <div class="grid" style="margin-top:12px">
   ${packageHtml}
  </div>
  ${bPlanHtml ? `<div class="grid" style="margin-top:12px">${bPlanHtml}</div>` : ''}
  <div class="box"><b>当天可选课表：</b>${po.available.length?po.available.map(x=>`<span class="pill blue">${esc(x)} (门槛:${Math.round(getRequiredCombat(x))})</span>`).join(""):`<span class="muted">未填写</span>`}</div>
  <div class="box"><h3>热量与饮食重点</h3>
   <div class="grid">
    <div class="col-4"><table><tr><td>计划训练消耗</td><td>${po.energy.planned.exercise} kcal</td></tr><tr><td>计划EPOC</td><td>${po.energy.planned.epoc} kcal</td></tr><tr><td>计划步数</td><td>${po.energy.planned.steps} 步</td></tr><tr><td>估算TDEE</td><td><b>${po.energy.planned.tdee} kcal</b></td></tr><tr><td>建议摄入</td><td><b>${po.energy.planned.targetIn} kcal</b></td></tr></table></div>
    <div class="col-8"><p><b>早餐：</b>${esc(meal.breakfast)}</p><p><b>训练前加餐：</b>${esc(meal.snack)}</p><p><b>午餐：</b>${esc(meal.lunch)}</p><p><b>晚餐：</b>${esc(meal.dinner)}</p>${meal.night?`<p><b>夜班：</b>${esc(meal.night)}</p>`:""}<p><b>心率：</b>${esc(meal.hr)}</p></div>
   </div>
  </div>
  <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
   <button class="primary" onclick="quickLogDate('${d}')">打卡这一天</button>
   <button class="secondary" onclick="quickClassDate('${d}')">编辑当天课表</button>
   <button class="secondary" onclick="quickScheduleDate('${d}')">编辑当天排班</button>
